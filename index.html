// ============ 21 种双重罪原型 ============
const ARCHETYPES = {

  pride_wrath:     { name: "裁决之剑",     desc: "你的骄傲带刃。你不允许自己被冒犯，一旦被触碰，你的回应会比对方想象中更锋利。" },
  pride_sloth:     { name: "沉睡的王者",   desc: "你相信自己不凡，却迟迟不愿动身。你在等一个配得上你的舞台，可舞台不会自己来找你。" },
  pride_greed:     { name: "无尽王座",     desc: "你想要的不是一时的胜利，而是永远的掌控。你的野心让你走得很远，也让你很难停下来。" },
  pride_gluttony:  { name: "盛宴之主",     desc: "你享受被仰望，也享受被款待。你的生活需要光，需要掌声，需要一切精致的东西围着你说「你值得」。" },
  pride_lust:      { name: "镜中之焰",     desc: "你的魅力是你的武器。你享受被渴望的感觉，但有时你分不清，你爱的是对方，还是对方眼中的自己。" },
  envy_wrath:      { name: "毒牙",         desc: "你的嫉妒会变成愤怒。你看着别人拥有的东西，心里的火越烧越旺，最后烧向别人，也烧向自己。" },
  envy_sloth:      { name: "灰烬低语",     desc: "你看见别人的光，然后选择把窗帘拉上。不是不想要，而是觉得争不过。你的痛，藏在沉默里。" },
  envy_greed:      { name: "暗流",         desc: "你不会明着抢，但你会暗暗布局。你的嫉妒让你更清楚自己想要什么。" },
  envy_gluttony:   { name: "空盘子",       desc: "你想要的东西很多，但你最想要的，是别人碗里的那一份。你不断往自己盘子里夹，却发现味道始终不对。" },
  envy_lust:       { name: "影子情人",     desc: "你渴望的，常常是别人的拥有。你的爱里有一丝不甘，你的欲望里藏着一句「为什么不是我」。" },
  wrath_sloth:     { name: "闷雷",         desc: "你的愤怒不常爆发，它在你心里积压，变成一种沉沉的倦怠。你不是没有火，只是火被困在灰里。" },
  wrath_greed:     { name: "铁血掠夺者",   desc: "你的怒火带着目的性。你不是为了发泄，而是为了得到。你的攻击性很强，但你很清楚自己要什么。" },
  wrath_gluttony:  { name: "烈焰饕客",     desc: "你生气的时候会吃东西，或者做别的让自己舒服的事。你的情绪需要一个出口，而你习惯用身体去消化它。" },
  wrath_lust:      { name: "燃烧的拥抱",   desc: "你的爱与怒界限模糊。你可以在同一个夜晚，既想掐死对方，又想抱住对方不放。" },
  sloth_greed:     { name: "沼泽收藏家",   desc: "你想要很多东西，却迟迟不动手。你的收藏夹里堆满了「以后要做」的事，但那个以后一直没有来。" },
  sloth_gluttony:  { name: "软枕深渊",     desc: "你最喜欢的状态，是什么都不做，舒舒服服地待着。你追求的是一种永远不会被打扰的安稳。" },
  sloth_lust:      { name: "温水",         desc: "你的感情是慢热的，甚至是懒散的。你渴望亲密，但你不愿意主动。你想要人陪，但不想费力气去争取。" },
  greed_gluttony:  { name: "无底金库",     desc: "你想要的，永远比现在多。钱、食物、体验、享受，你的欲望没有尽头，你也并不真的想让它有尽头。" },
  greed_lust:      { name: "占有之瞳",     desc: "你的爱带着占有欲。你不仅想要对方，还想对方完完全全属于你。这不是坏，但有时候会让人喘不过气。" },
  gluttony_lust:   { name: "感官极乐者",   desc: "味觉、触觉、视觉、听觉，一切能带来快感的通道你都敞开着。你活得很用力，也很享受。" }
};// ============ 状态 ============
let sinScores = {};
let emoScores = {};
let answers = [];
let current = 0;

Object.keys(SINS).forEach(function(k){ sinScores[k] = 0; });
Object.keys(EMOTIONS).forEach(function(k){ emoScores[k] = 0; });

// ============ 授权码验证 ============
async function verifyCode() {
  const code = document.getElementById('codeInput').value.trim();
  const btn = document.getElementById('authBtn');
  const err = document.getElementById('authErr');
  if (!code) { err.textContent = '请输入授权码'; return; }
  btn.disabled = true;
  btn.textContent = '验 证 中...';
  err.textContent = '';
  try {
    const res = await fetch('/.netlify/functions/verify', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ code })
    });
    const data = await res.json();
    if (data.valid) {
      document.getElementById('authCard').classList.add('hidden');
      document.getElementById('quizCard').classList.remove('hidden');
      renderQuestion();
    } else {
      err.textContent = '授权码错误，请重新输入';
    }
  } catch (e) {
    err.textContent = '网络错误，请稍后再试';
  } finally {
    btn.disabled = false;
    btn.textContent = '步 入 深 渊';
  }
}

// ============ 渲染题目 ============
function renderQuestion() {
  const q = QUESTIONS[current];
  document.getElementById('progressText').textContent = '第 ' + (current + 1) + ' / ' + QUESTIONS.length + ' 题';
  const percent = Math.round((current / QUESTIONS.length) * 100);
  document.getElementById('progressPercent').textContent = percent + '%';
  document.getElementById('progressFill').style.width = percent + '%';
  document.getElementById('question').textContent = q.q;

  const box = document.getElementById('options');
  box.innerHTML = '';
  q.a.forEach(function(item, idx) {
    const div = document.createElement('div');
    div.className = 'opt';
    div.textContent = item[0];
    if (answers[current] === idx) {
      div.style.borderColor = 'rgba(220,40,50,0.85)';
      div.style.background = 'rgba(140,15,25,0.2)';
      div.style.color = '#fff';
    }
    div.onclick = function() { choose(idx); };
    box.appendChild(div);
  });

  document.getElementById('prevBtn').disabled = (current === 0);
  const nextHint = document.getElementById('nextHint');
  if (answers[current] !== undefined) {
    nextHint.textContent = (current === QUESTIONS.length - 1) ? '揭 晓 结 果' : '下 一 题 →';
    nextHint.disabled = false;
    nextHint.onclick = (current === QUESTIONS.length - 1) ? showResult : nextQuestion;
  } else {
    nextHint.textContent = '选择答案后继续';
    nextHint.disabled = true;
    nextHint.onclick = null;
  }
}

// ============ 选择答案 ============
function choose(idx) {
  const q = QUESTIONS[current];
  const sin = q.a[idx][1];
  const emo = q.a[idx][2];

  if (answers[current] !== undefined) {
    const prevSin = q.a[answers[current]][1];
    const prevEmo = q.a[answers[current]][2];
    sinScores[prevSin]--;
    emoScores[prevEmo]--;
  }

  sinScores[sin]++;
  emoScores[emo]++;
  answers[current] = idx;

  const opts = document.querySelectorAll('.opt');
  opts.forEach(function(el, i) {
    if (i === idx) {
      el.style.borderColor = 'rgba(220,40,50,0.85)';
      el.style.background = 'rgba(140,15,25,0.2)';
      el.style.color = '#fff';
    } else {
      el.style.borderColor = 'rgba(140,20,30,0.35)';
      el.style.background = 'rgba(15,5,8,0.6)';
      el.style.color = '#d0c0c0';
    }
  });

  const nextHint = document.getElementById('nextHint');
  nextHint.textContent = (current === QUESTIONS.length - 1) ? '揭 晓 结 果' : '下 一 题 →';
  nextHint.disabled = false;
  nextHint.onclick = (current === QUESTIONS.length - 1) ? showResult : nextQuestion;
}

function prevQuestion() {
  if (current > 0) { current--; renderQuestion(); }
}
function nextQuestion() {
  if (answers[current] === undefined) return;
  if (current < QUESTIONS.length - 1) { current++; renderQuestion(); }
  else { showResult(); }
}

// ============ 显示结果 ============
function showResult() {
  for (let i = 0; i < QUESTIONS.length; i++) {
    if (answers[i] === undefined) {
      current = i;
      renderQuestion();
      alert('还有题目没答哦，已跳到第 ' + (i + 1) + ' 题');
      return;
    }
  }

  const sinList = Object.keys(sinScores).sort(function(a,b){ return sinScores[b] - sinScores[a]; });
  const mainSin = sinList[0];
  const subSin = sinList[1];

  const emoList = Object.keys(emoScores).sort(function(a,b){ return emoScores[b] - emoScores[a]; });
  const mainEmo = emoList[0];

  const sinData = SINS[mainSin];
  const emoData = EMOTIONS[mainEmo];
  const archetypeKey = mainSin + '_' + subSin;
  const archetype = ARCHETYPES[archetypeKey] || { name: "深渊旅人", desc: "你的主罪和副罪组合非常独特，你的阴影是独一无二的。" };

  document.getElementById('quizCard').classList.add('hidden');
  document.getElementById('resultCard').classList.remove('hidden');

  document.getElementById('resultEmoji').textContent = sinData.emoji;
  document.getElementById('resultTitle').textContent = '你 的 主 罪';
  document.getElementById('resultName').textContent = sinData.name;
  document.getElementById('resultLatin').textContent = sinData.latin.toUpperCase();
  document.getElementById('resultQuote').textContent = '「' + sinData.profile.split('。')[0] + '。」';

  document.getElementById('resultArchetype').innerHTML =
    '<strong style="color:#c9202e; font-size:16px;">' + archetype.name + '</strong><br><br>' + archetype.desc;

  document.getElementById('resultProfile').textContent = sinData.profile;
  document.getElementById('resultEmotion').innerHTML =
    emoData.emoji + ' <strong style="color:#c9202e;">' + emoData.name + '</strong> —— ' + emoData.desc;

  document.getElementById('resultAdvice').textContent = sinData.advice;

  const maxSin = Math.max.apply(null, sinList.map(function(k){ return sinScores[k]; })) || 1;
  const statsBox = document.getElementById('statsBox');
  statsBox.innerHTML = '';
  sinList.forEach(function(k) {
    const val = sinScores[k];
    const percent = Math.round((val / maxSin) * 100);
    const row = document.createElement('div');
    row.className = 'stat-row';
    row.innerHTML =
      '<div class="stat-label">' + SINS[k].name + '</div>' +
      '<div class="stat-bar"><div class="stat-fill" style="width:' + percent + '%"></div></div>' +
      '<div class="stat-num">' + val + '</div>';
    statsBox.appendChild(row);
  });

  window.__resultText = '我在《七宗罪 · 深渊人格图谱》里测出来是：\n' +
    sinData.emoji + ' 主罪：' + sinData.name + '（' + sinData.latin + '）\n' +
    '副罪：' + SINS[subSin].name + '\n' +
    '主情绪：' + emoData.name + '\n' +
    '双重原型：' + archetype.name + '\n' +
    '你也来测测你的原罪？\n' +
    window.location.href;
}

// ============ 分享结果 ============
function shareResult() {
  const text = window.__resultText || '我在《七宗罪 · 深渊人格图谱》里测出了一个结果！';
  if (navigator.share) {
    navigator.share({ title: '七宗罪 · 深渊人格图谱', text: text }).catch(function(){});
  } else {
    navigator.clipboard.writeText(text).then(function() {
      alert('结果已复制到剪贴板，去粘贴给朋友吧！');
    }).catch(function() {
      alert('复制失败，请手动截图分享。');
    });
  }
}

document.getElementById('codeInput').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') verifyCode();
});
</script>
